name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Choose the version
        id: version
        run: |
          last=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)
          if [[ -n "$last" && "$(git rev-list -n 1 "$last")" == "$(git rev-parse HEAD)" ]]; then
            echo "main has not changed since ${last}"
            exit 0
          fi
          version=$(python3 scripts/release.py version --nightly "$(date -u +%Y%m%d)")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Push the tag
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Foundation ${TAG#v}"
          git push origin "refs/tags/${TAG}"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
