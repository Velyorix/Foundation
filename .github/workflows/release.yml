name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z[-channel.N])
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" origin/main; then
            echo "::error::${TAG} does not point to a commit of main"
            exit 1
          fi

      - name: Build
        run: python3 scripts/release.py build "${TAG#v}" --ref "refs/tags/${TAG}" --out dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/foundation-*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            channel=(--prerelease --latest=false)
          else
            channel=(--latest)
          fi
          gh release create "$TAG" "dist/foundation-${version}.zip" dist/SHA256SUMS \
            --verify-tag \
            --title "Foundation ${version}" \
            --notes-file dist/release-notes.md \
            "${channel[@]}"

  website:
    name: Website
    needs: publish
    uses: ./.github/workflows/website.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
