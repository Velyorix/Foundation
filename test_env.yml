# selene definitions for test code: globals injected by tests/run.lua into spec files,
# and globals exported by packages loaded in integration suites.
---
name: test_env
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  before_each:
    args:
      - type: function
  after_each:
    args:
      - type: function
  expect:
    any: true
  Loader:
    any: true
  FoundationTest:
    any: true
  Foundation:
    any: true
  LifecycleProbe:
    any: true
  PackagesProbe:
    any: true
  ConfigFixture:
    any: true
  SchedulerFixture:
    any: true
  EventsFixture:
    any: true
  CommandsFixture:
    any: true
